name: Publish trusted application runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read tested source revision
        id: revision
        run: |
          revision="$(cat runtime-host-ref.txt)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "commit=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: DamenH/privacy-frames
          ref: ${{ steps.revision.outputs.commit }}
          path: host
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
        working-directory: host
      - run: npm run build
        working-directory: host
        env:
          HOST_ROLE: runtime
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: host/dist-runtime
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
